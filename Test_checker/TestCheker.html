<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Шалгагч Програм</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f5f7fb; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .upload-box { border: 2px dashed #4A90E2; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; background: #f9fbfd; }
        .btn { display: block; width: 100%; padding: 12px; background: #4A90E2; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .btn:hover { background: #357ABD; }
        #result { margin-top: 20px; padding: 15px; display: none; background: #eef9f0; border-left: 5px solid #52c41a; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Тест Шалгагч & Excel Гаргагч</h2>
    <p>Сурагчдын бөглөсөн тестийн зургуудыг сонгож оруулна уу.</p>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>📸 Зургуудаа энд чирээд тавих эсвэл товшиж сонгоно уу</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
    </div>

    <button class="btn" onclick="uploadAndProcess()">Тестийг Шалгах</button>

    <div id="result">
        <p style="color: #237804; font-weight: bold;">✅ Шалгаж дууслаа!</p>
        <a id="downloadLink" href="#" class="btn" style="background: #52c41a; text-align: center; text-decoration: none;">Excel Файл Татах</a>
    </div>
</div>

<script>
    function uploadAndProcess() {
        const input = document.getElementById('fileInput');
        if (input.files.length === 0) {
            alert('Бөглөсөн тестийн зураг оруулна уу!');
            return;
        }

        // Энд Backend руу зураг илгээх Fetch API код бичигдэнэ
        // Одоогоор симуляци хийж харуулж байна:
        alert("Зургуудыг уншиж байна, түр хүлээнэ үү...");
        
        setTimeout(() => {
            document.getElementById('result').style.display = 'block';
            document.getElementById('downloadLink').href = 'http://localhost:5000/download-excel'; // Backend-ээс ирэх хаяг
        }, 2000);
    }
</script>

</body>
</html>
