<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Тест Шалгагч Вэб систем</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .config-section {
            background: #eef2f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .config-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .config-section label {
            font-weight: bold;
        }
        .config-section input, .config-section textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .api-input { width: 350px; }
        .ans-input { width: 100%; height: 50px; font-family: monospace; resize: vertical; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #4A90E2;
            color: white;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        input[type="text"], input[type="number"] {
            width: 90%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-add { background: #4A90E2; color: white; }
        .btn-add:hover { background: #357ABD; }
        .btn-excel { background: #2ecc71; color: white; }
        .btn-excel:hover { background: #27ae60; }
        .btn-ai { background: #9b59b6; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-ai:hover { background: #8e44ad; }
        .btn-delete { background: #e74c3c; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-delete:hover { background: #c0392b; }
        .preview-img { max-width: 80px; max-height: 80px; border-radius: 4px; margin-top: 5px; display: block; margin-left: auto; margin-right: auto;}
        .status-text { font-size: 12px; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 AI Тест Шалгах & Excel Систем</h2>
    
    <div class="config-section">
        <div class="config-row">
            <label>1. Google Gemini API Key оруулна уу:</label>
            <input type="password" id="apiKey" class="api-input" placeholder="AI түлхүүрээ энд хуулна уу...">
            <span style="font-size: 12px; color: #666;">(<a href="https://aistudio.google.com/" target="_blank">Эндээс үнэгүй авах</a>)</span>
        </div>
        <div class="config-row">
            <label>2. Тестийн нийт асуултын тоо:</label>
            <input type="number" id="maxScore" value="10" style="width: 60px;" onchange="recalculateAll()">
        </div>
        <div>
            <label>3. Тестийн зөв хариултууд (Зааварчилгаа болгож AI-д өгнө):</label>
            <textarea id="correctAnswers" class="ans-input" placeholder="Жишээ: 1.A, 2.B, 3.C, 4.D, 5.A ... эсвэл 'Зөв хариултууд: 1-Б, 2-В, 3-А' гэж бичиж болно"></textarea>
        </div>
    </div>

    <table id="studentTable">
        <thead>
            <tr>
                <th style="width: 5%;">№</th>
                <th style="width: 25%;">Сурагчийн овог нэр</th>
                <th style="width: 25%;">Тестийн зураг</th>
                <th style="width: 15%;">Авсан оноо</th>
                <th style="width: 15%;">Хувь (%)</th>
                <th style="width: 15%;">Үйлдэл</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div class="btn-group">
        <button class="btn btn-add" onclick="addRow()">➕ Сурагч нэмэх</button>
        <button class="btn btn-excel" onclick="exportToExcel()">🍏 Excel файл болгож татах</button>
    </div>
</div>

<script>
    let rowCount = 0;

    // Шинэ мөр нэмэх функц
    function addRow() {
        rowCount++;
        const tbody = document.getElementById('tableBody');
        const tr = document.createElement('tr');
        tr.id = `row-${rowCount}`;
        
        tr.innerHTML = `
            <td>${tbody.children.length + 1}</td>
            <td><input type="text" placeholder="Сурагчийн нэр" class="student-name" id="name-${rowCount}"></td>
            <td>
                <input type="file" accept="image/*" onchange="previewImage(this, ${rowCount})" id="file-${rowCount}">
                <img id="preview-${rowCount}" class="preview-img" style="display:none;">
            </td>
            <td>
                <input type="number" value="0" min="0" class="student-score" id="score-${rowCount}" oninput="calculatePercent(${rowCount})">
                <div id="status-${rowCount}" class="status-text"></div>
            </td>
            <td id="percent-${rowCount}" class="student-percent" style="font-weight:bold;">0%</td>
            <td>
                <button class="btn btn-ai" onclick="analyzeImage(${rowCount})">🤖 AI Шалгах</button>
                <button class="btn btn-delete" onclick="deleteRow(${rowCount})" style="margin-top:5px;">Устгах</button>
            </td>
        `;
        
        tbody.appendChild(tr);
    }

    // Зургийг урьдчилж харах
    function previewImage(input, id) {
        const preview = document.getElementById(`preview-${id}`);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Хувь бодох
    function calculatePercent(id) {
        const maxScore = parseFloat(document.getElementById('maxScore').value) || 1;
        const scoreInput = document.getElementById(`score-${id}`);
        let score = parseFloat(scoreInput.value) || 0;

        if (score > maxScore) {
            score = maxScore;
            scoreInput.value = maxScore;
        }

        const percent = ((score / maxScore) * 100).toFixed(1);
        document.getElementById(`percent-${id}`).innerText = `${percent}%`;
    }

    function recalculateAll() {
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            const id = row.id.split('-')[1];
            calculatePercent(id);
        });
    }

    function deleteRow(id) {
        document.getElementById(`row-${id}`).remove();
        reindexRows();
    }

    function reindexRows() {
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach((row, index) => {
            row.children[0].innerText = index + 1;
        });
    }

    // Зургийг Base64 формат руу хөрвүүлэх туслах функц
    function fileToGenerativePart(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                const base64Data = reader.result.split(',')[1];
                resolve({
                    inlineData: {
                        data: base64Data,
                        mimeType: file.type
                    },
                });
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // Google Gemini AI ашиглан зураг уншиж шалгах үндсэн функц
    async function analyzeImage(id) {
        const apiKey = document.getElementById('apiKey').value.trim();
        const correctAnswers = document.getElementById('correctAnswers').value.trim();
        const maxScore = document.getElementById('maxScore').value;
        const fileInput = document.getElementById(`file-${id}`);
        const statusDiv = document.getElementById(`status-${id}`);

        if (!apiKey) {
            alert("Та эхлээд Google Gemini API Key-ээ оруулна уу!");
            return;
        }
        if (!fileInput.files || fileInput.files.length === 0) {
            alert("Шалгах тестийн зургийг оруулна уу!");
            return;
        }

        statusDiv.innerText = "⏳ AI засаж байна...";
        statusDiv.style.color = "#d35400";

        try {
            const imagePart = await fileToGenerativePart(fileInput.files[0]);
            
            // AI-д өгөх удирдамж зааварчилгаа
            const prompt = `
                Та багшийн туслах AI байна. Өгөгдсөн цаасан тестийн зургийг маш сайн шинжилж үзээд дараах даалгаврыг гүйцэтгэнэ үү.
                
                Тестийн зөв хариултуудын загвар: ${correctAnswers}
                Нийт байж болох хамгийн их оноо: ${maxScore}

                Даалгавар:
                1. Зураг дээрээс сурагчийн нэрийг олж тогтоох (Хэрэв нэр байхгүй эсвэл уншигдахгүй бол "Тодорхойгүй" гэх).
                2. Сурагчийн тэмдэглэсэн эсвэл бичсэн хариултуудыг зөв хариулттай тулгаж, хэдэн оноо авсныг тооцоолох. Хэрэв гар аргаар зассан тэмдэглэгээ (багшийн зөв, буруу гэсэн зураас) байвал түүнийг ашиглаж болно.
                
                ХАРИУГ ЗӨВХӨН дараах JSON форматаар буцаагаарай, өөр ямар ч илүү текст битгий бич:
                {
                    "student_name": "Олсон сурагчийн нэр",
                    "score_earned": авсан онооны тоо (бүхэл эсвэл бутархай тоо байж болно)
                }
            `;

            // Gemini API руу хүсэлт илгээх (Gemini 2.5 Flash модель ашиглав)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            imagePart
                        ]
                    }]
                })
            });

            const result = await response.json();
            const aiText = result.candidates[0].content.parts[0].text;
            
            // JSON-ийг цэвэрлэж унших (AI заримдаа ```json ... ``` дотор хариу өгдөг)
            const cleanJson = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
            const data = JSON.parse(cleanJson);

            // Үр дүнг хүснэгтэд оруулах
            if(data.student_name && data.student_name !== "Тодорхойгүй") {
                document.getElementById(`name-${id}`).value = data.student_name;
            }
            
            document.getElementById(`score-${id}`).value = data.score_earned;
            calculatePercent(id);

            statusDiv.innerText = "✅ Амжилттай заслаа!";
            statusDiv.style.color = "#27ae60";

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ Алдаа гарлаа!";
            statusDiv.style.color = "#c0392b";
            alert("AI зургийг уншиж чадсангүй. Та API түлхүүрээ зөв эсэхийг эсвэл зургийн чанараа шалгана уу.");
        }
    }

    // Excel руу хөрвүүлж татах функц
    function exportToExcel() {
        const rows = document.querySelectorAll('#tableBody tr');
        if (rows.length === 0) {
            alert("Татахаас өмнө ядаж нэг сурагчийн мэдээлэл оруулна уу!");
            return;
        }

        const maxScore = document.getElementById('maxScore').value;
        const data = [
            ["Тестийн нийт оноо:", maxScore, "", ""],
            [],
            ["№", "Сурагчийн овог нэр", "Авсан оноо", "Хувь (%)"]
        ];

        rows.forEach((row, index) => {
            const id = row.id.split('-')[1];
            const name = document.getElementById(`name-${id}`).value || `Сурагч ${index + 1}`;
            const score = document.getElementById(`score-${id}`).value || 0;
            const percent = document.getElementById(`percent-${id}`).innerText;
            data.push([index + 1, name, parseFloat(score), percent]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Дүнгийн хуудас");
        XLSX.writeFile(workbook, "AI_Тестийн_Дүн.xlsx");
    }

    // Эхлээд шууд 1 хоосон мөр үүсгэж харуулна
    window.onload = function() {
        addRow();
    }
</script>

</body>
</html>
