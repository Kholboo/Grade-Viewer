<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Тест Шалгагч Вэб систем</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .config-section {
            background: #eef2f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .config-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .config-section label {
            font-weight: bold;
        }
        .config-section input, .config-section textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .api-input { width: 350px; }
        .ans-input { width: 100%; height: 50px; font-family: monospace; resize: vertical; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #4A90E2;
            color: white;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        input[type="text"], input[type="number"] {
            width: 90%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-add { background: #4A90E2; color: white; }
        .btn-add:hover { background: #357ABD; }
        .btn-excel { background: #2ecc71; color: white; }
        .btn-excel:hover { background: #27ae60; }
        .btn-ai { background: #9b59b6; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-ai:hover { background: #8e44ad; }
        .btn-delete { background: #e74c3c; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-delete:hover { background: #c0392b; }
        .preview-img { max-width: 80px; max-height: 80px; border-radius: 4px; margin-top: 5px; display: block; margin-left: auto; margin-right: auto;}
        .status-text { font-size: 12px; font-weight: bold; color: #7f8c8d; }
        /* Preview Modal Styles */
        .preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .preview-modal.active {
            display: flex;
        }
        .preview-modal-content {
            position: relative;
            background: white;
            border-radius: 12px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .preview-modal-header {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .preview-modal-title {
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }
        .preview-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .preview-modal-close:hover {
            color: #000;
        }
        .preview-modal-body {
            padding: 20px;
            text-align: center;
        }
        .preview-modal-body img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
        }
        .preview-image-clickable {
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .preview-image-clickable:hover {
            opacity: 0.8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        /* Status Modal Styles */
        .status-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            padding: 20px;
        }
        .status-modal.active {
            display: flex;
        }
        .status-modal-content {
            position: relative;
            background: white;
            border-radius: 12px;
            max-width: 700px;
            max-height: 80vh;
            overflow: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
        }
        .status-modal-header {
            font-weight: bold;
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .status-modal-close:hover {
            color: #000;
        }
        .answer-key {
            background: #f0f4f8;
            padding: 16px;
            border-radius: 8px;
            margin: 12px 0;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.8;
            border-left: 4px solid #4A90E2;
        }
        .answer-list {
            list-style: none;
            padding: 0;
        }
        .answer-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .answer-list li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 AI Тест Шалгах & Excel Систем</h2>
    
    <div class="config-section">
        <div class="config-row">
            <label>1. Google Gemini API Key оруулна уу:</label>
            <input type="password" id="apiKey" class="api-input" placeholder="AI түлхүүрээ энд хуулна уу...">
            <span style="font-size: 12px; color: #666;">(<a href="https://aistudio.google.com/" target="_blank">Эндээс үнэгүй авах</a>)</span>
        </div>
        <div class="config-row">
            <label>2. Тестийн нийт асуултын тоо:</label>
            <input type="number" id="maxScore" value="10" style="width: 60px;" onchange="recalculateAll()">
        </div>
        <div>
            <label>3. Тестийн зөв хариултууд (Зааварчилгаа болгож AI-д өгнө):</label>
            <textarea id="correctAnswers" class="ans-input" placeholder="Жишээ: 1.A, 2.B, 3.C, 4.D, 5.A ... эсвэл 'Зөв хариултууд: 1-Б, 2-В, 3-А' гэж бичиж болно"></textarea>
        </div>
    </div>

    <table id="studentTable">
        <thead>
            <tr>
                <th style="width: 5%;">№</th>
                <th style="width: 25%;">Сурагчийн овог нэр</th>
                <th style="width: 25%;">Тестийн зураг</th>
                <th style="width: 15%;">Авсан оноо</th>
                <th style="width: 15%;">Хувь (%)</th>
                <th style="width: 15%;">Үйлдэл</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <div class="btn-group">
        <button class="btn btn-add" onclick="addRow()">➕ Сурагч нэмэх</button>
        <button class="btn btn-excel" onclick="exportToExcel()">🍏 Excel файл болгож татах</button>
    </div>
</div>

<div id="imagePreviewModal" class="preview-modal" onclick="closeImagePreview(event)">
    <div class="preview-modal-content" onclick="event.stopPropagation()">
        <div class="preview-modal-header">
            <div class="preview-modal-title" id="previewTitle">Тестийн зургийг томоор харах</div>
            <button class="preview-modal-close" onclick="closeImagePreview()" aria-label="Хаах">✕</button>
        </div>
        <div class="preview-modal-body">
            <img id="previewImage" alt="Test image preview" />
        </div>
    </div>
</div>

<div id="statusModal" class="status-modal" onclick="closeTestStatus(event)">
    <div class="status-modal-content" onclick="event.stopPropagation()">
        <div class="status-modal-header">
            <div>Тестийн зөв/буруу статус</div>
            <button class="status-modal-close" onclick="closeTestStatus()" aria-label="Хаах">✕</button>
        </div>
        <div id="statusContent"></div>
    </div>
</div>

<script>
    let rowCount = 0;

    function addRow() {
        rowCount++;
        const tbody = document.getElementById('tableBody');
        const tr = document.createElement('tr');
        tr.id = `row-${rowCount}`;
        
        tr.innerHTML = `
            <td>${tbody.children.length + 1}</td>
            <td><input type="text" placeholder="Сурагчийн нэр" class="student-name" id="name-${rowCount}"></td>
            <td>
                <input type="file" accept="image/*" onchange="previewImage(this, ${rowCount})" id="file-${rowCount}">
                <img id="preview-${rowCount}" class="preview-img preview-image-clickable" style="display:none;" onclick="openImagePreview(${rowCount})" title="Том хэмжээтэй харах дарна уу">
            </td>
            <td>
                <input type="number" value="0" min="0" class="student-score" id="score-${rowCount}" oninput="calculatePercent(${rowCount})">
                <div id="status-${rowCount}" class="status-text"></div>
            </td>
            <td id="percent-${rowCount}" class="student-percent" style="font-weight:bold;">0%</td>
            <td>
                <button class="btn btn-ai" onclick="analyzeImage(${rowCount})">🤖 AI Шалгах</button>
                <button class="btn btn-ai" onclick="showTestStatus(${rowCount})" title="Тестийн зөв/буруу статус харуулах" style="background: #16a085; margin-top:5px;">📋 Статус</button>
                <button class="btn btn-delete" onclick="deleteRow(${rowCount})" style="margin-top:5px;">Устгах</button>
            </td>
            <input type="hidden" id="answers-${rowCount}" value="">
            <input type="hidden" id="studentAns-${rowCount}" value="">
        `;
        
        tbody.appendChild(tr);
    }

    function previewImage(input, id) {
        const preview = document.getElementById(`preview-${id}`);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function calculatePercent(id) {
        const maxScore = parseFloat(document.getElementById('maxScore').value) || 1;
        const scoreInput = document.getElementById(`score-${id}`);
        let score = parseFloat(scoreInput.value) || 0;

        if (score > maxScore) {
            score = maxScore;
            scoreInput.value = maxScore;
        }

        const percent = ((score / maxScore) * 100).toFixed(1);
        document.getElementById(`percent-${id}`).innerText = `${percent}%`;
    }

    function recalculateAll() {
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            const id = row.id.split('-')[1];
            calculatePercent(id);
        });
    }

    function deleteRow(id) {
        document.getElementById(`row-${id}`).remove();
        reindexRows();
    }

    function reindexRows() {
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach((row, index) => {
            row.children[0].innerText = index + 1;
        });
    }

    function fileToGenerativePart(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                const base64Data = reader.result.split(',')[1];
                resolve({
                    inlineData: {
                        data: base64Data,
                        mimeType: file.type
                    },
                });
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function analyzeImage(id) {
        const apiKey = document.getElementById('apiKey').value.trim();
        const correctAnswers = document.getElementById('correctAnswers').value.trim();
        const maxScore = document.getElementById('maxScore').value;
        const fileInput = document.getElementById(`file-${id}`);
        const statusDiv = document.getElementById(`status-${id}`);

        if (!apiKey) {
            alert("Та эхлээд Google Gemini API Key-ээ оруулна уу!");
            return;
        }
        if (!fileInput.files || fileInput.files.length === 0) {
            alert("Шалгах тестийн зургийг оруулна уу!");
            return;
        }

        statusDiv.innerText = "⏳ AI засаж байна...";
        statusDiv.style.color = "#d35400";

        try {
            const imagePart = await fileToGenerativePart(fileInput.files[0]);
            
            const prompt = `
                Та багшийн туслах AI байна. Өгөгдсөн цаасан тестийн зургийг маш сайн шинжилж үзээд дараах даалгаврыг гүйцэтгэнэ үү.
                
                Тестийн зөв хариултуудын загвар: ${correctAnswers}
                Нийт байж болох хамгийн их оноо: ${maxScore}

                Даалгавар:
                1. Зураг дээрээс сурагчийн нэрийг олж тогтоох (Хэрэв нэр байхгүй эсвэл уншигдахгүй бол "Тодорхойгүй" гэх).
                2. Сурагчийн тэмдэглэсэн эсвэл бичсэн хариултуудыг зөв хариулттай тулгаж, хэдэн оноо авсныг тооцоолох.
                3. Асуулт бүрийн статусыг хай: зөв (O) эсвэл буруу (X). Хэрэв хариулаагүй бол (X) гэх.
                4. Сурагчийн сонгосон хариултыг олж (A/B/C/D эсвэл хариулаагүй бол "Хоосон") бүртгэх.
                
                ХАРИУГ ЗӨВХӨН дараах JSON форматаар буцаагаарай, өөр ямар ч илүү текст битгий бич:
                {
                    "student_name": "Олсон сурагчийн нэр",
                    "score_earned": авсан онооны тоо,
                    "question_status": "OXOXOXOXOO",
                    "student_answers": ["B", "B", "B", "D", "A", "B", "B", "Хоосон", "B", "B"]
                }
            `;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            imagePart
                        ]
                    }]
                })
            });

            const result = await response.json();
            const aiText = result.candidates[0].content.parts[0].text;
            
            const cleanJson = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
            const data = JSON.parse(cleanJson);

            if(data.student_name && data.student_name !== "Тодорхойгүй") {
                document.getElementById(`name-${id}`).value = data.student_name;
            }
            
            document.getElementById(`score-${id}`).value = data.score_earned;
            
            if (data.question_status) {
                const cleanStatus = data.question_status.replace(/\s/g, '');
                document.getElementById(`answers-${id}`).value = cleanStatus;
            }

            if (data.student_answers) {
                document.getElementById(`studentAns-${id}`).value = JSON.stringify(data.student_answers);
            }
            
            calculatePercent(id);

            statusDiv.innerText = "✅ Амжилттай заслаа!";
            statusDiv.style.color = "#27ae60";

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ Алдаа гарлаа!";
            statusDiv.style.color = "#c0392b";
            alert("AI зургийг уншиж чадсангүй.");
        }
    }

    function exportToExcel() {
        const rows = document.querySelectorAll('#tableBody tr');
        if (rows.length === 0) {
            alert("Татахаас өмнө ядаж нэг сурагчийн мэдээлэл оруулна уу!");
            return;
        }

        const maxScore = document.getElementById('maxScore').value;
        const data = [
            ["Тестийн нийт оноо:", maxScore, "", ""],
            [],
            ["№", "Сурагчийн овог нэр", "Авсан оноо", "Хувь (%)"]
        ];

        rows.forEach((row, index) => {
            const id = row.id.split('-')[1];
            const name = document.getElementById(`name-${id}`).value || `Сурагч ${index + 1}`;
            const score = document.getElementById(`score-${id}`).value || 0;
            const percent = document.getElementById(`percent-${id}`).innerText;
            data.push([index + 1, name, parseFloat(score), percent]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Дүнгийн хуудас");
        XLSX.writeFile(workbook, "AI_Тестийн_Дүн.xlsx");
    }

    window.onload = function() {
        addRow();
    }

    function openImagePreview(id) {
        const preview = document.getElementById(`preview-${id}`);
        const previewImage = document.getElementById('previewImage');
        const previewTitle = document.getElementById('previewTitle');
        const studentName = document.getElementById(`name-${id}`).value || `Сурагч ${id}`;
        
        if (!preview.src || preview.style.display === 'none') {
            alert('Таны оруулсан зургийг эхлээд шалгана уу!');
            return;
        }
        
        previewTitle.textContent = `${studentName} - Тестийн Comic`;
        previewImage.src = preview.src;
        document.getElementById('imagePreviewModal').classList.add('active');
    }

    function closeImagePreview(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('imagePreviewModal').classList.remove('active');
    }

    function showTestStatus(id) {
        const correctAnswers = document.getElementById('correctAnswers').value.trim();
        const studentName = document.getElementById(`name-${id}`).value || `Сурагч ${id}`;
        const score = document.getElementById(`score-${id}`).value || 0;
        const maxScore = document.getElementById('maxScore').value;
        const questionStatus = document.getElementById(`answers-${id}`).value;
        const studentAnsRaw = document.getElementById(`studentAns-${id}`).value;
        
        let studentAnswersArray = [];
        if (studentAnsRaw) {
            try {
                studentAnswersArray = JSON.parse(studentAnsRaw);
            } catch(e) { console.error(e); }
        }
        
        if (!correctAnswers) {
            alert('Эхлээд зөв хариултуудыг оруулна уу!');
            return;
        }
        
        const answerLines = correctAnswers.split('\n').filter(line => line.trim().length > 0);
        
        let answerListHtml = '<ul class="answer-list">';
        answerLines.forEach(line => {
            answerListHtml += `<li>${line}</li>`;
        });
        answerListHtml += '</ul>';
        
        let questionStatusHtml = '';
        if (questionStatus && questionStatus.length > 0) {
            questionStatusHtml = '<div style="margin-bottom: 16px;"><strong style="display: block; margin-bottom: 12px;">✅/❌ Асуулт бүрийн статус ба сурагчийн хариулт:</strong>';
            questionStatusHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px;">';
            
            for (let i = 0; i < questionStatus.length; i++) {
                const status = questionStatus[i];
                const isCorrect = status === 'O' || status === 'o';
                const icon = isCorrect ? '✅' : '❌';
                const bgColor = isCorrect ? '#d4edda' : '#f8d7da';
                const borderColor = isCorrect ? '#c3e6cb' : '#f5c6cb';
                const textColor = isCorrect ? '#155724' : '#721c24';
                
                // Сурагчийн тэмдэглэсэн хариултыг массив дотроос олох
                const chosenAns = studentAnswersArray[i] ? studentAnswersArray[i] : "-";
                
                questionStatusHtml += `
                    <div style="padding: 10px 5px; background: ${bgColor}; border: 2px solid ${borderColor}; border-radius: 8px; text-align: center; font-weight: bold;">
                        <div style="font-size: 20px; margin-bottom: 4px;">${icon}</div>
                        <div style="font-size: 13px; color: ${textColor};">${i + 1}-р асуулт</div>
                        <div style="font-size: 12px; margin-top: 5px; background: rgba(255,255,255,0.6); padding: 2px; border-radius: 4px;">Сонгосон: <span style="font-size:14px; color:#2c3e50;">${chosenAns}</span></div>
                    </div>
                `;
            }
            
            questionStatusHtml += '</div></div>';
        }
        
        const statusContent = `
            <div style="margin-bottom: 16px;">
                <strong>Сурагч:</strong> ${studentName}
            </div>
            <div style="margin-bottom: 16px; padding: 12px; background: #f0f9ff; border-radius: 6px; border-left: 4px solid #2196F3;">
                <strong>Оноо:</strong> ${score} / ${maxScore} (${((score / maxScore) * 100).toFixed(1)}%)
            </div>
            ${questionStatusHtml}
            <div id="wrongQuestionsDiv" style="margin-bottom: 16px;"></div>
            <div style="margin-bottom: 12px;">
                <strong style="display: block; margin-bottom: 8px;">📋 Зөв хариултуудын жагсаалт:</strong>
                <div class="answer-key">${answerListHtml}</div>
            </div>
            <div style="padding: 12px; background: #fef5e7; border-radius: 6px; border-left: 4px solid #f39c12; font-size: 13px;">
                <strong>💡 Зөвлөмж:</strong> Сурагчийн хариултыг дээрх жагсаалттай хянаж үзнэ үү.
            </div>
        `;
        
        document.getElementById('statusContent').innerHTML = statusContent;
        
        if (questionStatus && questionStatus.length > 0) {
            const wrongQuestions = [];
            for (let i = 0; i < questionStatus.length; i++) {
                const status = questionStatus[i];
                const isCorrect = status === 'O' || status === 'o';
                if (!isCorrect) {
                    wrongQuestions.push(i + 1);
                }
            }
            
            if (wrongQuestions.length > 0) {
                const wrongDiv = document.getElementById('wrongQuestionsDiv');
                wrongDiv.innerHTML = `
                    <div style="padding: 12px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; border-left: 4px solid #ff6b6b;">
                        <strong style="color: #856404;">⚠️ Алдаа гаргасан асуултууд:</strong>
                        <div style="color: #856404; margin-top: 8px; font-size: 14px;">
                            <strong>Нийт ${wrongQuestions.length} асуулт дээр алдсан:</strong> ${wrongQuestions.join(', ')}-р асуултууд
                        </div>
                    </div>
                `;
            }
        }
        
        document.getElementById('statusModal').classList.add('active');
    }

    function closeTestStatus(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('statusModal').classList.remove('active');
    }
</script>

</body>
</html>
